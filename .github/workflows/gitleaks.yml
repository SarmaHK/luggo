name: Secret scan

# Required status check: "Gitleaks secret scan" (see docs/SECRET_SCANNING.md for the
# branch-protection setting). Separate from ci.yml and from Vercel deployments.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full-history scan.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history; the scan range depends on the event
          persist-credentials: false
      # pull_request / push: scans the new commits. schedule / manual run: scans the
      # entire history. The action masks matches (--redact) and we turn off the
      # report artifact and PR comments so no finding text is stored or posted.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
